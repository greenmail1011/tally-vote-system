
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正字計票板</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
      background: #f5f5f0; color: #1a1a1a; min-height: 100vh;
    }

    /* ── 頂部 ── */
    .topbar {
      background: #fff; border-bottom: 1px solid #e0ddd8;
      padding: 12px 20px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .topbar h1 { font-size: 17px; font-weight: 500; flex: 1; min-width: 120px; }
    .save-badge { font-size: 11px; color: #888; background: #f0ede8; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
    .save-badge.saved { color: #2a7a4b; background: #e6f4ec; }
    .topbar-btn {
      font-size: 12px; padding: 6px 13px; border-radius: 7px;
      border: 1px solid #ccc; background: #fff; color: #444; cursor: pointer;
    }
    .topbar-btn:hover { background: #f0ede8; }
    .topbar-btn.danger { border-color: #f5c6c6; color: #CC2200; }
    .topbar-btn.danger:hover { background: #fff5f3; }

    /* ── 新增候選人列 ── */
    .add-row {
      background: #fff; border-bottom: 1px solid #e8e5e0;
      padding: 10px 20px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .add-row label { font-size: 13px; color: #555; white-space: nowrap; }
    .add-input {
      font-size: 14px; padding: 6px 12px; border-radius: 8px;
      border: 1px solid #ccc; font-family: inherit; outline: none; width: 160px;
    }
    .add-input:focus { border-color: #CC2200; }
    .add-btn {
      font-size: 13px; padding: 6px 14px; border-radius: 8px;
      border: none; background: #CC2200; color: #fff; cursor: pointer; font-weight: 500; white-space: nowrap;
    }
    .add-btn:hover { background: #aa1a00; }
    .per-row-wrap { display: flex; align-items: center; gap: 6px; margin-left: auto; }
    .per-row-wrap label { font-size: 12px; color: #888; white-space: nowrap; }
    .per-row-input {
      width: 50px; font-size: 13px; padding: 4px 6px; border-radius: 6px;
      border: 1px solid #ccc; text-align: center; font-family: inherit; outline: none;
    }

    /* ── 分輪標籤 ── */
    .main { padding: 14px 20px; }
    .tab-bar { display: flex; gap: 5px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
    .tab {
      font-size: 13px; padding: 5px 14px; border-radius: 7px;
      border: 1px solid #ccc; background: #fff; color: #666; cursor: pointer;
    }
    .tab.active { background: #CC2200; color: #fff; border-color: #CC2200; font-weight: 500; }
    .tab:not(.active):hover { background: #f0ede8; }
    .btn-add-round {
      font-size: 12px; padding: 5px 12px; border-radius: 7px;
      border: 1px dashed #bbb; background: transparent; color: #999; cursor: pointer;
    }
    .btn-add-round:hover { color: #CC2200; border-color: #CC2200; }

    /* ── 分段 ── */
    .board-section { margin-bottom: 14px; }
    .section-label {
      font-size: 11px; color: #999; font-weight: 500; letter-spacing: 0.5px;
      margin-bottom: 5px; padding-left: 2px;
    }
    .columns-scroll { overflow-x: auto; border-radius: 10px; }

    /* ── 計票主體 ── */
    .columns-wrap {
      display: inline-flex; gap: 1px;
      background: #ccc; border: 1px solid #ccc;
      border-radius: 10px; overflow: hidden;
    }
    .no-candidates {
      padding: 40px; text-align: center; color: #aaa; font-size: 14px;
      background: #fff; border-radius: 10px; border: 1px dashed #ddd;
    }

    /* ── 候選人欄 ── */
    .col { background: #fff; width: 88px; flex-shrink: 0; display: flex; flex-direction: column; }

    .col-head {
      padding: 6px 5px 5px; background: #f0ede8;
      border-bottom: 1px solid #ddd; position: relative;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      min-height: 58px;
    }
    /* 刪除按鈕 */
    .btn-del-col {
      position: absolute; top: 3px; right: 3px;
      width: 16px; height: 16px; border-radius: 4px;
      border: none; background: transparent; color: #ccc;
      cursor: pointer; font-size: 11px; line-height: 1;
      display: flex; align-items: center; justify-content: center; padding: 0;
    }
    .col-head:hover .btn-del-col { color: #CC2200; background: #ffe8e3; }
    .btn-del-col:hover { color: #CC2200 !important; }

    /* 姓名（可點擊編輯） */
    .col-name {
      font-size: 12px; font-weight: 500; text-align: center;
      word-break: break-all; line-height: 1.4; color: #1a1a1a;
      cursor: pointer; padding: 1px 16px 1px 4px;
      border-bottom: 1px dashed transparent; width: 100%;
    }
    .col-name:hover { border-bottom-color: #CC2200; color: #CC2200; }
    .col-name-input {
      font-size: 12px; font-weight: 500; text-align: center; width: 100%;
      border: none; border-bottom: 1.5px solid #CC2200;
      background: transparent; outline: none; font-family: inherit; color: #1a1a1a;
      padding: 0 4px;
    }
    .col-total { font-size: 20px; font-weight: 700; color: #CC2200; line-height: 1; }
    .col-total-unit { font-size: 10px; color: #bbb; font-weight: 400; }

    .col-body {
      flex: 1; padding: 6px 5px;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      cursor: pointer; min-height: 90px;
      transition: background 0.1s; user-select: none;
    }
    .col-body:hover { background: #fdf9f9; }
    .col-body:active { background: #f5ecec; }
    .empty-hint { font-size: 10px; color: #ccc; margin-top: 8px; text-align: center; line-height: 1.5; }

    /* ── 按鈕列 ── */
    .col-footer { padding: 5px 4px; border-top: 1px solid #eee; display: flex; gap: 3px; }
    .btn-add-vote {
      flex: 1; font-size: 12px; font-weight: 600; padding: 6px 0;
      border-radius: 6px; border: none; background: #1a9e5c; color: #fff; cursor: pointer;
    }
    .btn-add-vote:hover { background: #158a4f; }
    .btn-add-vote:active { transform: scale(0.96); }
    .btn-sub-vote {
      flex: 1; font-size: 12px; font-weight: 600; padding: 6px 0;
      border-radius: 6px; border: none; background: #e07c1a; color: #fff; cursor: pointer;
    }
    .btn-sub-vote:hover { background: #c56c14; }
    .btn-sub-vote:active { transform: scale(0.96); }

    /* ── 摘要 ── */
    .summary-bar {
      margin-top: 10px; padding: 8px 14px;
      background: #fff; border: 1px solid #e0ddd8; border-radius: 8px;
      font-size: 12px; color: #555; display: flex; gap: 12px; flex-wrap: wrap;
    }
    .summary-bar strong { color: #1a1a1a; }

    @media print {
      .topbar, .add-row, .col-footer, .btn-add-round, .btn-del-col, .summary-bar { display: none; }
      .col-name { border-bottom: none !important; cursor: default; }
    }
  </style>
</head>
<body>

<!-- 頂部工具列 -->
<div class="topbar">
  <h1>正字計票板</h1>
  <span class="save-badge" id="saveBadge">尚未儲存</span>
  <button class="topbar-btn" onclick="newRound()">＋ 新一輪</button>
  <button class="topbar-btn" onclick="resetRound()">↺ 清空此輪</button>
  <button class="topbar-btn" onclick="window.print()">🖨 列印</button>
  <button class="topbar-btn danger" onclick="clearAllData()">清除所有資料</button>
</div>

<!-- 新增候選人 -->
<div class="add-row">
  <label>新增候選人：</label>
  <input class="add-input" id="addInput" placeholder="輸入姓名" maxlength="10"
         onkeydown="if(event.key==='Enter') quickAdd()" />
  <button class="add-btn" onclick="quickAdd()">＋ 新增</button>
  <div class="per-row-wrap">
    <label>每段人數：</label>
    <input class="per-row-input" type="number" id="perRowInput" min="5" max="50"
           onchange="changePerRow()" />
  </div>
</div>

<!-- 主內容 -->
<div class="main">
  <div class="tab-bar" id="tabBar"></div>
  <div id="boardWrap"></div>
  <div class="summary-bar" id="summaryBar" style="display:none"></div>
</div>

<script>
/* ── 正字筆順 ── */
const RED = "#CC2200";
const STROKES = [
  "M5,7 L35,7",
  "M20,7 L20,37",
  "M20,22 L35,22",
  "M12,22 L12,37",
  "M5,37 L35,37"
];
function makeZhengSVG(n) {
  let p = '';
  for (let i = 0; i < n && i < 5; i++)
    p += `<path d="${STROKES[i]}" stroke="${RED}" stroke-width="3" stroke-linecap="round" fill="none"/>`;
  return `<svg viewBox="0 0 40 44" width="34" height="38" xmlns="http://www.w3.org/2000/svg">${p}</svg>`;
}

/* ── localStorage ── */
const KEY = 'zheng_tally_v1';
function defaultData() {
  return { candidates: [], perRow: 18, rounds: [{ votes: [] }], currentRound: 0, savedAt: null };
}
function loadData() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return defaultData();
    const d = JSON.parse(raw);
    if (!d.perRow) d.perRow = 18;
    d.rounds.forEach(r => { while (r.votes.length < d.candidates.length) r.votes.push(0); });
    return d;
  } catch(e) { return defaultData(); }
}
function saveData() {
  data.savedAt = new Date().toISOString();
  localStorage.setItem(KEY, JSON.stringify(data));
  updateSaveBadge();
}
function updateSaveBadge() {
  const el = document.getElementById('saveBadge');
  if (!data.savedAt) { el.textContent = '尚未儲存'; el.className = 'save-badge'; return; }
  const d = new Date(data.savedAt);
  const t = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  el.textContent = `已儲存 ${t}`; el.className = 'save-badge saved';
}

let data = loadData();

/* ── 渲染 ── */
function render() {
  document.getElementById('perRowInput').value = data.perRow;
  renderTabs();
  renderBoard();
  renderSummary();
  updateSaveBadge();
}

function renderTabs() {
  const tb = document.getElementById('tabBar');
  if (data.rounds.length <= 1) { tb.innerHTML = ''; return; }
  tb.innerHTML = data.rounds.map((r, i) =>
    `<button class="tab${i===data.currentRound?' active':''}" onclick="switchRound(${i})">第 ${i+1} 輪</button>`
  ).join('') + `<button class="btn-add-round" onclick="newRound()">＋ 新一輪</button>`;
}

function renderBoard() {
  const wrap = document.getElementById('boardWrap');
  if (!data.candidates.length) {
    wrap.innerHTML = `<div class="no-candidates">
      在上方輸入候選人姓名，按「＋ 新增」即可開始<br><br>
      <button onclick="loadDefault35()" style="font-size:13px;padding:8px 20px;border-radius:8px;border:1px solid #CC2200;background:#fff;color:#CC2200;cursor:pointer;font-weight:500">
        載入 35 位預設候選人（方便測試後刪減）
      </button>
    </div>`;
    return;
  }
  const round = data.rounds[data.currentRound];
  const perRow = data.perRow || 18;
  const sections = [];
  for (let i = 0; i < data.candidates.length; i += perRow)
    sections.push({ start: i, end: Math.min(i + perRow, data.candidates.length) });
  const showLabel = sections.length > 1;

  wrap.innerHTML = sections.map((sec, si) => {
    const cols = [];
    for (let ci = sec.start; ci < sec.end; ci++) {
      const name = data.candidates[ci];
      const v = round.votes[ci] || 0;
      const full = Math.floor(v/5), rem = v%5;
      let svgs = '';
      for (let g=0; g<full; g++) svgs += makeZhengSVG(5);
      if (rem > 0) svgs += makeZhengSVG(rem);
      if (!full && !rem) svgs = `<span class="empty-hint">點擊或<br>按 +1</span>`;

      cols.push(`
        <div class="col">
          <div class="col-head">
            <button class="btn-del-col" onclick="deleteCandidate(event,${ci})" title="刪除此候選人">✕</button>
            <div class="col-name" id="cname-${ci}" onclick="editName(${ci})" title="點擊修改姓名">${name}</div>
            <div class="col-total">${v}<span class="col-total-unit"> 票</span></div>
          </div>
          <div class="col-body" onclick="addVote(${ci})">${svgs}</div>
          <div class="col-footer">
            <button class="btn-add-vote" onclick="addVote(${ci})">+1</button>
            <button class="btn-sub-vote" onclick="subVote(event,${ci})">−1</button>
          </div>
        </div>`);
    }
    const label = showLabel
      ? `<div class="section-label">第 ${si+1} 段（第 ${sec.start+1}～${sec.end} 位，共 ${sec.end-sec.start} 人）</div>`
      : '';
    return `<div class="board-section">
      ${label}
      <div class="columns-scroll"><div class="columns-wrap">${cols.join('')}</div></div>
    </div>`;
  }).join('');
}

function renderSummary() {
  const el = document.getElementById('summaryBar');
  if (!data.candidates.length) { el.style.display='none'; return; }
  el.style.display = 'flex';
  const round = data.rounds[data.currentRound];
  const total = round.votes.reduce((a,b)=>a+b,0);
  el.innerHTML = `<span>總票數：<strong>${total}</strong> 票</span>`;
}

/* ── 候選人操作 ── */
function quickAdd() {
  const inp = document.getElementById('addInput');
  const name = inp.value.trim(); if (!name) { inp.focus(); return; }
  data.candidates.push(name);
  data.rounds.forEach(r => r.votes.push(0));
  inp.value = ''; saveData(); render();
  // 捲到最後一段
  setTimeout(() => {
    const sections = document.querySelectorAll('.board-section');
    if (sections.length) sections[sections.length-1].scrollIntoView({ behavior:'smooth', block:'nearest' });
  }, 50);
  inp.focus();
}

function deleteCandidate(e, ci) {
  e.stopPropagation();
  if (!confirm(`確定要刪除「${data.candidates[ci]}」？`)) return;
  data.candidates.splice(ci, 1);
  data.rounds.forEach(r => r.votes.splice(ci, 1));
  saveData(); render();
}

function editName(ci) {
  const el = document.getElementById(`cname-${ci}`);
  if (!el) return;
  const inp = document.createElement('input');
  inp.className = 'col-name-input';
  inp.value = data.candidates[ci]; inp.maxLength = 10;
  el.replaceWith(inp); inp.focus(); inp.select();
  function save() {
    const val = inp.value.trim() || data.candidates[ci];
    data.candidates[ci] = val;
    saveData(); render();
  }
  inp.addEventListener('blur', save);
  inp.addEventListener('keydown', e => {
    if (e.key==='Enter') { e.preventDefault(); inp.blur(); }
    if (e.key==='Escape') { inp.value=data.candidates[ci]; inp.blur(); }
  });
}

function changePerRow() {
  const v = parseInt(document.getElementById('perRowInput').value);
  if (v >= 5 && v <= 50) { data.perRow = v; saveData(); render(); }
}

/* ── 計票 ── */
function addVote(ci) {
  data.rounds[data.currentRound].votes[ci] = (data.rounds[data.currentRound].votes[ci]||0)+1;
  saveData(); render();
}
function subVote(e, ci) {
  e.stopPropagation();
  const r = data.rounds[data.currentRound];
  if (r.votes[ci]>0) { r.votes[ci]--; saveData(); render(); }
}
function switchRound(i) { data.currentRound=i; saveData(); render(); }
function newRound() {
  data.rounds.push({ votes: new Array(data.candidates.length).fill(0) });
  data.currentRound=data.rounds.length-1; saveData(); render();
}
function resetRound() {
  if (!confirm(`確定要清空第 ${data.currentRound+1} 輪的所有票數？`)) return;
  data.rounds[data.currentRound].votes = new Array(data.candidates.length).fill(0);
  saveData(); render();
}
function clearAllData() {
  if (!confirm('確定要清除所有候選人與票數？此操作無法復原。')) return;
  localStorage.removeItem(KEY); data=defaultData(); render();
}

/* ── 預設35人 ── */
function loadDefault35() {
  const names = [
    '候選人01','候選人02','候選人03','候選人04','候選人05',
    '候選人06','候選人07','候選人08','候選人09','候選人10',
    '候選人11','候選人12','候選人13','候選人14','候選人15',
    '候選人16','候選人17','候選人18','候選人19','候選人20',
    '候選人21','候選人22','候選人23','候選人24','候選人25',
    '候選人26','候選人27','候選人28','候選人29','候選人30',
    '候選人31','候選人32','候選人33','候選人34','候選人35'
  ];
  data.candidates = names;
  data.rounds = [{ votes: new Array(35).fill(0) }];
  data.currentRound = 0;
  saveData(); render();
}

/* ── 啟動 ── */
render();
if (!data.candidates.length) document.getElementById('addInput').focus();
</script>
</body>
</html>
