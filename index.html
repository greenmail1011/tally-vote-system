
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正字計票板</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
      background: #f5f5f0;
      color: #1a1a1a;
      padding: 24px;
      min-height: 100vh;
    }
    h1 { font-size: 20px; font-weight: 500; margin-bottom: 16px; }

    /* ── 分輪標籤 ── */
    .tab-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      align-items: center;
    }
    .tab {
      font-size: 13px;
      padding: 6px 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: #fff;
      color: #666;
      cursor: pointer;
    }
    .tab.active {
      background: #CC2200;
      color: #fff;
      border-color: #CC2200;
      font-weight: 500;
    }
    .tab:not(.active):hover { background: #f0ede8; }
    .btn-add-round {
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px dashed #bbb;
      background: transparent;
      color: #999;
      cursor: pointer;
    }
    .btn-add-round:hover { color: #CC2200; border-color: #CC2200; }

    /* ── 計票主體 ── */
    .columns-wrap {
      display: flex;
      gap: 1px;
      background: #ccc;
      border: 1px solid #ccc;
      border-radius: 10px;
      overflow: hidden;
    }
    .col {
      background: #fff;
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .col-head {
      padding: 10px 8px;
      background: #f0ede8;
      border-bottom: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .col-name {
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      word-break: break-all;
      cursor: pointer;
      border-bottom: 1px dashed #aaa;
      padding-bottom: 1px;
    }
    .col-name:hover { color: #CC2200; border-bottom-color: #CC2200; }
    .col-name-input {
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      width: 90%;
      border: none;
      border-bottom: 2px solid #CC2200;
      background: transparent;
      outline: none;
      font-family: inherit;
      color: #1a1a1a;
    }
    .col-total { font-size: 12px; color: #666; }
    .col-body {
      flex: 1;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      user-select: none;
      min-height: 160px;
      transition: background 0.1s;
    }
    .col-body:hover { background: #f8f7f4; }
    .col-body:active { background: #eeece8; }
    .empty-hint { font-size: 12px; color: #aaa; margin-top: 12px; }
    .col-footer {
      padding: 6px;
      display: flex;
      justify-content: center;
      border-top: 1px solid #eee;
    }
    .btn-minus {
      font-size: 18px;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1px solid #ddd;
      background: transparent;
      color: #666;
      cursor: pointer;
    }
    .btn-minus:hover { background: #f0ede8; }

    /* ── 工具列 ── */
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .name-input {
      font-size: 14px;
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: #fff;
      color: #1a1a1a;
      width: 130px;
    }
    .name-input:focus { outline: 2px solid #CC2200; border-color: transparent; }
    .btn {
      font-size: 13px;
      padding: 7px 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: #fff;
      color: #333;
      cursor: pointer;
    }
    .btn:hover { background: #f0ede8; }

    @media print {
      body { background: #fff; padding: 12px; }
      .toolbar, .col-footer, .btn-add-round { display: none; }
      .col-name { border-bottom: none; }
    }
  </style>
</head>
<body>

<h1>正字計票板</h1>

<div class="tab-bar" id="tabBar"></div>
<div class="columns-wrap" id="columns"></div>

<div class="toolbar">
  <input class="name-input" id="newName" placeholder="輸入候選人名稱" maxlength="8" />
  <button class="btn" onclick="addColumn()">＋ 新增欄位</button>
  <button class="btn" onclick="resetRound()">↺ 清空此輪</button>
  <button class="btn" onclick="window.print()">🖨 列印</button>
</div>

<script>
/*
  正字正確筆順（5畫）：
  1 上橫：全寬頂部橫線
  2 中豎：由上橫偏左位置（x=14）向下貫穿至底（全高）
  3 右橫：由中豎往右延伸（僅右半邊，x=14→x=36）
  4 左豎：左側短豎，對齊最左邊（x=4），從中橫高度往下至底
  5 下橫：全寬底部橫線
*/
const RED = "#CC2200";
const STROKES = [
  "M5,7 L35,7",    // 1 上橫（全寬）
  "M20,7 L20,37",  // 2 中豎（全高貫穿）
  "M20,22 L35,22", // 3 右橫（中豎往右，右半邊）
  "M12,22 L12,37", // 4 左豎（往右移，位於左側 x=12）
  "M5,37 L35,37"   // 5 下橫（全寬）
];

function makeZhengSVG(n) {
  let paths = '';
  for (let i = 0; i < n && i < 5; i++)
    paths += `<path d="${STROKES[i]}" stroke="${RED}" stroke-width="3" stroke-linecap="round" fill="none"/>`;
  return `<svg viewBox="0 0 40 44" width="36" height="40" xmlns="http://www.w3.org/2000/svg">${paths}</svg>`;
}

let cur = 0;
let rounds = [
  { cols: [{ name: "候選人一", votes: 0 }, { name: "候選人二", votes: 0 }, { name: "候選人三", votes: 0 }] }
];

function render() {
  // 標籤列
  const tb = document.getElementById('tabBar');
  tb.innerHTML = rounds.map((r, i) =>
    `<button class="tab${i===cur?' active':''}" onclick="switchRound(${i})">第 ${i+1} 輪</button>`
  ).join('') + `<button class="btn-add-round" onclick="newRound()">＋ 新一輪</button>`;

  // 計票主體
  const wrap = document.getElementById('columns');
  wrap.innerHTML = '';
  const cols = rounds[cur].cols;

  cols.forEach((col, ci) => {
    const full = Math.floor(col.votes / 5);
    const rem  = col.votes % 5;

    let svgs = '';
    for (let g = 0; g < full; g++) svgs += makeZhengSVG(5);
    if (rem > 0) svgs += makeZhengSVG(rem);
    if (!full && !rem) svgs = `<span class="empty-hint">點擊加票</span>`;

    const el = document.createElement('div');
    el.className = 'col';
    el.innerHTML = `
      <div class="col-head">
        <div class="col-name" id="name-${ci}" onclick="editName(${ci})" title="點擊修改名稱">${col.name}</div>
        <div class="col-total">${col.votes} 票</div>
      </div>
      <div class="col-body" onclick="addVote(${ci})" title="點擊加一票">${svgs}</div>
      <div class="col-footer">
        <button class="btn-minus" onclick="subVote(event,${ci})" title="減一票">−</button>
      </div>`;
    wrap.appendChild(el);
  });
}

function switchRound(i) { cur = i; render(); }

function newRound() {
  // 複製目前候選人名稱，票數歸零
  const names = rounds[cur].cols.map(c => c.name);
  rounds.push({ cols: names.map(n => ({ name: n, votes: 0 })) });
  cur = rounds.length - 1;
  render();
}

function editName(ci) {
  const nameEl = document.getElementById(`name-${ci}`);
  if (!nameEl) return;
  const input = document.createElement('input');
  input.className = 'col-name-input';
  input.value = rounds[cur].cols[ci].name;
  input.maxLength = 8;
  nameEl.replaceWith(input);
  input.focus(); input.select();
  function save() {
    const val = input.value.trim() || rounds[cur].cols[ci].name;
    // 同步所有輪次的同位候選人名稱
    rounds.forEach(r => { if (r.cols[ci]) r.cols[ci].name = val; });
    render();
  }
  input.addEventListener('blur', save);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { input.value = rounds[cur].cols[ci].name; input.blur(); }
  });
}

function addVote(i) { rounds[cur].cols[i].votes++; render(); }
function subVote(e, i) {
  e.stopPropagation();
  if (rounds[cur].cols[i].votes > 0) { rounds[cur].cols[i].votes--; render(); }
}

function addColumn() {
  const inp = document.getElementById('newName');
  const name = inp.value.trim() || `候選人${rounds[0].cols.length + 1}`;
  rounds.forEach(r => r.cols.push({ name, votes: 0 }));
  inp.value = ''; render();
}

function resetRound() {
  if (confirm(`確定要清空第 ${cur + 1} 輪的票數？`)) {
    rounds[cur].cols.forEach(c => c.votes = 0);
    render();
  }
}

render();
</script>
</body>
</html>
